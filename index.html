<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potato成长视频计划</title>
<style id="css">
:root{--bg:#fbf6ec;--card:#fff;--ink:#2f2a24;--dim:#8a8073;--line:#ece3d3;--brand:#d9822b;--brand2:#f3b23a;--ok:#3f9b5a;--bad:#d9534f;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:17px;line-height:1.5}
header{padding:18px 18px 10px;display:flex;align-items:center;gap:12px}
header h1{font-size:22px;margin:0;line-height:1.2}
header p{margin:2px 0 0;color:var(--dim);font-size:14px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;border-radius:12px;padding:12px;font-size:17px;font-weight:700;background:#efe6d6;color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}
main{padding:14px 16px 140px;max-width:640px;margin:0 auto}
.banner{background:#fff3d6;border:1px solid #f1d38f;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.shop{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line);margin-bottom:12px}
.shop label{font-size:14px;color:var(--dim);display:block;margin-bottom:6px}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:17px;font-family:inherit;background:#fffdf9;color:var(--ink)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--brand)}
.prog{margin:4px 0 14px}
.bar{height:12px;background:#efe6d6;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));width:0;transition:width .25s}
.progtxt{display:flex;justify-content:space-between;font-size:14px;color:var(--dim);margin-top:6px}
.group{background:var(--card);border-radius:16px;border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
.group h2{margin:0;font-size:17px;padding:12px 14px;background:#fbf3e3;display:flex;justify-content:space-between;align-items:center}
.group h2 span{font-size:13px;color:var(--dim);font-weight:600}
.item{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.item:first-of-type{border-top:0}
.chk{flex:0 0 30px;height:30px;border-radius:9px;border:2px solid #cdbfa8;background:#fff;display:flex;align-items:center;justify-content:center;margin-top:1px}
.item.done .chk{background:var(--ok);border-color:var(--ok)}
.item.done .chk::after{content:"";width:9px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.item .t{flex:1}
.item.done .t .main{color:var(--dim)}
.item .sub{font-size:13px;color:var(--dim)}
.item input[type=text]{margin-top:8px;font-size:16px;padding:9px 10px}
.notes{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:14px;margin-bottom:12px}
.notes h2{margin:0 0 8px;font-size:17px}
.actions{position:fixed;left:0;right:0;bottom:0;background:rgba(251,246,236,.97);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}
.btn{flex:1;border:0;border-radius:14px;padding:14px 8px;font-size:16px;font-weight:800;font-family:inherit}
.primary{background:var(--brand);color:#fff}
.ghost{background:#efe6d6;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:18px;max-width:360px;width:100%}
.modal .row{display:flex;gap:8px;margin-top:14px}
.shot{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px}
.num{flex:0 0 34px;height:34px;border-radius:50%;background:var(--bad);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.shot h3{margin:0 0 4px;font-size:17px}
.shot .k{font-size:13px;color:var(--dim)}
.shot p{margin:2px 0;font-size:15px}
.sec{font-size:19px;margin:22px 0 10px}
.rule{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;font-size:15px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pair div{border-radius:12px;padding:10px 12px;font-size:14px}
.no{background:#fbe9e8;border:1px solid #f1c6c4}.yes{background:#e6f3ea;border:1px solid #bfe0c9}
.gsave{display:block;width:calc(100% - 28px);margin:4px 14px 14px;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:800;font-family:inherit;background:var(--ok);color:#fff}
.group.locked h2{background:#e6f3ea}
.group.locked .item{opacity:.7}
.unlock{border:0;background:none;color:var(--dim);font-size:13px;text-decoration:underline;font-family:inherit;padding:0 0 0 8px}
.hist{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.hist h3{margin:0;font-size:17px}
.hist .meta{font-size:13px;color:var(--dim);margin:2px 0 10px}
.hist .row{display:flex;gap:8px}
.hist .btn{padding:10px 6px;font-size:14px}
.danger{background:#fbe9e8;color:var(--bad)}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
.hide{display:none}
</style>
</head>
<body>
<script id="app">
(function(){
var SAVED = window.__POTATO_SAVED__ || null;
var KEY = "potato_v1";
var HKEY = "potato_hist_v1";
var POTATO = '<svg width="52" height="56" viewBox="0 0 52 56" aria-hidden="true"><ellipse cx="26" cy="30" rx="21" ry="24" fill="#c98b4a"/><ellipse cx="26" cy="29" rx="18.5" ry="21.5" fill="#e3a967"/><circle cx="15" cy="20" r="1.8" fill="#b97a3c"/><circle cx="36" cy="40" r="1.6" fill="#b97a3c"/><circle cx="33" cy="16" r="1.3" fill="#b97a3c"/><ellipse cx="19" cy="30" rx="2.4" ry="3.2" fill="#3a2614"/><ellipse cx="33" cy="30" rx="2.4" ry="3.2" fill="#3a2614"/><path d="M21 37 Q26 41 31 37" stroke="#3a2614" stroke-width="2.2" fill="none" stroke-linecap="round"/><ellipse cx="14" cy="36" rx="3" ry="2" fill="#f0927a" opacity=".7"/><ellipse cx="38" cy="36" rx="3" ry="2" fill="#f0927a" opacity=".7"/><path d="M26 6 Q27 1 31 2" stroke="#4f9a5b" stroke-width="2.4" fill="none" stroke-linecap="round"/><ellipse cx="32" cy="3" rx="4" ry="2.4" fill="#64b56f" transform="rotate(-20 32 3)"/></svg>';

var GROUPS = [
 {id:"g1", name:"出发前", items:[
  {id:"a1", t:"跟老板讲好今天来拍，问清楚哪里可以拍、哪些人不要拍到"},
  {id:"a2", t:"手机直拍（竖的）", s:"4K 30fps 或 1080p 60fps"},
  {id:"a3", t:"镜头擦干净"}]},
 {id:"g2", name:"先拍证据（一到店就拍）", items:[
  {id:"b1", t:"店门口招牌", s:"白天拍；招牌是晚上亮灯设计的才加拍晚上"},
  {id:"b2", t:"菜单（每一页）", s:"正对着拍，字要看得清"},
  {id:"b3", t:"价钱牌 / 套餐价", s:"照片 + 5 秒视频"},
  {id:"b4", t:"营业时间"},
  {id:"b5", t:"停车位"}]},
 {id:"g3", name:"拍摄镜头", items:[
  {id:"c1", t:"开车路线", s:"尽量白天拍；只拍车子在走，2–3 段，每段约 10 秒"},
  {id:"c2", t:"走去店的路"},
  {id:"c3", t:"推门进店 + 店里环境", s:"客人脸不要拍清楚"},
  {id:"c4", t:"主角食物：原料 → 制作过程 → 成品特写"},
  {id:"c5", t:"最好吃那一刻", s:"夹起、切开、拉丝、淋酱、冒烟，要有声音"},
  {id:"c6", t:"酱料 / 配料 / 自助区（有的话）"},
  {id:"c7", t:"整套上桌", s:"俯拍一条 + 45 度一条"},
  {id:"c8", t:"试吃 + 真实反应", s:"脸对着光"}]},
 {id:"g4", name:"店家资料（问老板，填好自动打勾）", items:[
  {id:"d1", t:"地址 / 靠近什么地标", input:true},
  {id:"d2", t:"价钱（套餐多少钱、几个人吃）", input:true},
  {id:"d3", t:"营业时间", input:true},
  {id:"d4", t:"停车方便吗、在哪里", input:true},
  {id:"d5", t:"招牌菜 / 最好吃的 3 样", input:true},
  {id:"d6", t:"特别之处（任吃、自助、优惠…）", input:true}]},
 {id:"g5", name:"收工前", items:[
  {id:"e1", t:"用 Google Drive 或 AirDrop 交原档", s:"不要用 WhatsApp，画质会被压糊"}]}
];

var SHOTS = [
 ["开场钩子","最好吃那一刻：夹起、切开、拉丝、淋酱、冒烟","很近拍，动作慢，要有声","5–10秒 × 3条"],
 ["地标出发","有名的地方（桥、塔、老建筑、大字招牌）","尽量白天；手机架放仪表板，地标要入镜，车子在走才拍","10秒 × 2段"],
 ["开去店的路","开车经过的路、转弯进小巷","白天拍；红灯停车就停止录，绿灯走了再录","10秒 × 2–3段"],
 ["停车位","店附近或店后面的停车位","站着慢慢左右扫，或从车里开进去","5秒"],
 ["店门口","招牌 + 整间店正面","白天拍；站远一点拍全部，慢慢向前走推近；亮灯招牌才加拍晚上","5–8秒 × 2"],
 ["推门进店","第一视角走进店","手机放胸口高度，慢慢走","5秒"],
 ["店里环境","座位、装潢、灯、人气","站在角落慢慢左右移，客人脸不要清楚","5秒 × 2"],
 ["菜单 / 价钱牌","价钱、套餐内容","正对着，字要清楚，慢慢推近","5秒 + 照片"],
 ["主角食物（原料）","生的食材、原料、准备好的样子","俯拍或 45 度，用手拿起来给镜头看","5秒 × 2"],
 ["制作过程","煮、烤、炸、炒、冲饮料、摆盘","45 度，动作拍完整","5–10秒 × 2"],
 ["声音特写","滋滋声、炸油声、倒饮料、切开的声音","越近越好，开声音，不要讲话","10秒 × 3"],
 ["酱料 / 配料","淋酱、蘸酱、撒料、加冰","很近拍，动作慢","5秒 × 2"],
 ["自助区 / 饮料区","自己拿的食材、饮料、配料（有的话）","从左到右慢慢移动","5秒"],
 ["整套上桌","员工或 talent 把食物放上桌","俯拍一条 + 45 度一条","5秒 × 2"],
 ["试吃反应","talent 吃第一口 → 真实反应","脸对着光，从拿起拍到吃完表情","10秒 × 3"]
];
var RULES = [
 ["拿稳 5 秒","按下录影先不要动，数 1–5 才慢慢移。剪辑要的就是那稳稳的几秒。"],
 ["不要边拍边 zoom","想拍近一点就自己走近，不要用手指放大，会模糊、会晃。"],
 ["光要从前面来","背对窗口或灯，让光照在食物和人脸上。对着窗口拍会黑黑一块。"],
 ["3 个角度轮着拍","俯拍（整套）、45 度（上锅、酱料）、平视（夹起、冒烟，最有食欲）。"],
 ["动作要慢","夹、倒、走都放慢一半，慢的后面可以加速。"],
 ["声音开着，嘴巴关着","滋滋声、倒水声很有用。拍食物时不要讲话。"]
];
var PAIRS = [
 ["开车一口气录 1–2 分钟，红灯也在录","分开录 10 秒一段，只录车子在走"],
 ["横着拍","全部竖着拍"],
 ["拍到一半用手指 zoom","要近就走近"],
 ["晚上暗暗的棚下拍试吃，脸黑黑","坐在灯下面，脸对着光；太暗就开手电筒补光"],
 ["对着窗口拍，食物变黑影","背对窗口，让光照在食物上"],
 ["拍食物时一直讲「哇好香哦」","拍食物不讲话，反应镜头才讲"],
 ["只拍食物，没拍招牌和价钱牌","一到店先拍证据"]
];

function blank(){return {id:"s"+Date.now(), shop:"", ticks:{}, info:{}, notes:"", locked:{}, savedAt:null};}
function loadHist(){ try{ return JSON.parse(localStorage.getItem(HKEY)||"[]")||[]; }catch(e){ return []; } }
function saveHist(h){ try{ localStorage.setItem(HKEY, JSON.stringify(h)); }catch(e){} }
var VIEW = null;
if(!SAVED){ var vm = location.hash.match(/^#view=(.+)$/); if(vm){ var vid=decodeURIComponent(vm[1]); loadHist().forEach(function(x){ if(x.id===vid) VIEW=x; }); if(VIEW) SAVED=VIEW; } }
window.addEventListener("hashchange", function(){ location.reload(); });
var state = blank();
try{ if(SAVED){ state = SAVED; } else { var raw = localStorage.getItem(KEY); if(raw) state = JSON.parse(raw); } }catch(e){}
if(!state.locked) state.locked = {};
if(!state.ticks) state.ticks = {};
if(!state.info) state.info = {};
if(!state.id){ state.id = "s"+Date.now(); }
function persist(){ if(SAVED) return; try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function el(tag, attrs, html){ var n=document.createElement(tag); if(attrs) for(var k in attrs){ if(k==="class") n.className=attrs[k]; else n.setAttribute(k,attrs[k]); } if(html!=null) n.innerHTML=html; return n; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function allItems(){ var a=[]; GROUPS.forEach(function(g){ g.items.forEach(function(i){ a.push(i); }); }); return a; }
function isDoneIn(st,i){ return i.input ? !!((st.info||{})[i.id]||"").trim() : !!(st.ticks||{})[i.id]; }
function isDone(i){ return isDoneIn(state,i); }
function stamp(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()+" "+d.getHours()+":"+(d.getMinutes()<10?"0":"")+d.getMinutes(); }
function hasContent(){ if((state.shop||"").trim()) return true; for(var k in state.ticks) if(state.ticks[k]) return true; for(var j in state.info) if((state.info[j]||"").trim()) return true; return false; }
function archive(){ if(SAVED || !hasContent()) return; var snap=JSON.parse(JSON.stringify(state)); snap.savedAt=stamp(); snap.mmdd=today(); var h=loadHist().filter(function(x){ return x.id!==snap.id; }); h.unshift(snap); saveHist(h); }
function today(){ var d=new Date(); return (d.getMonth()+1<10?"0":"")+(d.getMonth()+1)+(d.getDate()<10?"0":"")+d.getDate(); }

var root = el("div");
document.body.appendChild(root);
root.appendChild(el("header",null, POTATO+'<div><h1>Potato成长视频计划</h1><p>探店拍摄清单 · 拍完一样勾一样</p></div>'));
var tabs = el("div",{class:"tabs"});
var t1 = el("button",{class:"tab on",type:"button"},"清单"), t2 = el("button",{class:"tab",type:"button"},"详细说明"), t3 = el("button",{class:"tab",type:"button"},"记录");
tabs.appendChild(t1); tabs.appendChild(t2); if(!SAVED) tabs.appendChild(t3); root.appendChild(tabs);
var main1 = el("main"), main2 = el("main",{class:"hide"}), main3 = el("main",{class:"hide"});
root.appendChild(main1); root.appendChild(main2); root.appendChild(main3);
function showTab(n){ [t1,t2,t3].forEach(function(t,ix){ t.className="tab"+(n===ix+1?" on":""); }); [main1,main2,main3].forEach(function(m,ix){ m.className=n===ix+1?"":"hide"; }); actions.style.display=n===1?"flex":"none"; if(n===3) renderHist(); window.scrollTo(0,0); }
t1.onclick=function(){showTab(1);}; t2.onclick=function(){showTab(2);}; t3.onclick=function(){showTab(3);};

// ---- tab 1: checklist ----
if(!SAVED){ main1.appendChild(el("div",{class:"banner"},"提示：如果是在 WhatsApp 里打开，请按右上角 ⋯ 选「用 Chrome / Safari 打开」，打勾才会保存。")); }
if(SAVED){ var bn=el("div",{class:"banner"},"这是 <b>"+esc(state.shop||"未命名店")+"</b> 的拍摄存档"+(state.savedAt?"（保存于 "+esc(state.savedAt)+"）":"")+"。"); if(VIEW){ var back=el("button",{class:"btn ghost",type:"button",style:"margin-top:8px;width:100%"},"← 返回记录"); back.onclick=function(){ location.hash="hist"; }; bn.appendChild(back); } main1.appendChild(bn); }
var shopBox = el("div",{class:"shop"});
shopBox.appendChild(el("label",null,"店名（保存的文件会用这个名字）"));
var shopIn = el("input",{type:"text",placeholder:"例如：R98麻辣火锅"}); shopIn.value = state.shop||"";
shopIn.oninput=function(){ state.shop=shopIn.value; persist(); };
if(SAVED) shopIn.readOnly=true;
shopBox.appendChild(shopIn); main1.appendChild(shopBox);
var prog = el("div",{class:"prog"},'<div class="bar"><i></i></div><div class="progtxt"><span class="p1"></span><span class="p2"></span></div>');
main1.appendChild(prog);
var counters = {};
GROUPS.forEach(function(g){
 var box = el("div",{class:"group"}); var h = el("h2",null, esc(g.name)+' <span><b class="cnt" style="font-weight:600"></b></span>'); counters[g.id]=h.querySelector(".cnt"); box.appendChild(h);
 var ul = el("button",{class:"unlock",type:"button"},"解锁"); ul.onclick=function(){ state.locked[g.id]=false; persist(); refresh(); }; h.querySelector("span").appendChild(ul); g._ul=ul; g._box=box;
 g.items.forEach(function(i){
  var row = el("div",{class:"item"}); var c = el("div",{class:"chk",role:"checkbox"}); var t = el("div",{class:"t"},'<div class="main">'+esc(i.t)+'</div>'+(i.s?'<div class="sub">'+esc(i.s)+'</div>':''));
  row.appendChild(c); row.appendChild(t);
  if(i.input){ var inp = el("input",{type:"text",placeholder:"填这里"}); inp.value = state.info[i.id]||""; inp.oninput=function(){ state.info[i.id]=inp.value; persist(); refresh(); }; t.appendChild(inp); c.onclick=function(){ if(!inp.disabled) inp.focus(); }; i._inp=inp; }
  else { row.onclick=function(){ if(SAVED || state.locked[g.id]) return; state.ticks[i.id]=!state.ticks[i.id]; persist(); refresh(); }; }
  i._row=row; box.appendChild(row);
 });
 var gb = el("button",{class:"gsave",type:"button"},"保存这部分 ✓");
 gb.onclick=function(){ state.locked[g.id]=true; persist(); refresh(); sendPart(g); };
 box.appendChild(gb); g._btn=gb;
 main1.appendChild(box);
});
var notes = el("div",{class:"notes"},"<h2>备注</h2>"); var ta = el("textarea",{rows:"3",placeholder:"有什么要跟老板讲的，写这里"}); ta.value = state.notes||""; ta.oninput=function(){ state.notes=ta.value; persist(); }; if(SAVED) ta.readOnly=true; notes.appendChild(ta); main1.appendChild(notes);

function refresh(){
 var items=allItems(), done=items.filter(isDone).length;
 prog.querySelector("i").style.width=(100*done/items.length)+"%";
 prog.querySelector(".p1").textContent="完成 "+done+" / "+items.length;
 prog.querySelector(".p2").textContent=done===items.length?"全部完成 👍":"还差 "+(items.length-done)+" 样";
 items.forEach(function(i){ i._row.className="item"+(isDone(i)?" done":""); });
 GROUPS.forEach(function(g){
  var d=g.items.filter(isDone).length, n=g.items.length, lk=!!state.locked[g.id];
  counters[g.id].textContent=(lk?"已保存 ✓ ":"")+d+"/"+n;
  g._box.className="group"+(lk?" locked":"");
  g._btn.style.display=(d===n && !lk && !SAVED)?"block":"none";
  g._ul.style.display=(lk && !SAVED)?"":"none";
  g.items.forEach(function(i){ if(i._inp) i._inp.disabled = lk || !!SAVED; });
 });
}
refresh();

// ---- tab 2: details ----
main2.appendChild(el("h2",{class:"sec"},"必拍镜头（照顺序拍）"));
main2.appendChild(el("div",{class:"rule"},"每个镜头拍 2–3 条，每条至少拿稳 5 秒。"));
SHOTS.forEach(function(s,ix){ main2.appendChild(el("div",{class:"shot"},'<div class="num">'+(ix+1)+'</div><div><h3>'+esc(s[0])+'</h3><p><span class="k">拍什么</span> · '+esc(s[1])+'</p><p><span class="k">怎样拍</span> · '+esc(s[2])+'</p><p><span class="k">长度</span> · '+esc(s[3])+'</p></div>')); });
main2.appendChild(el("h2",{class:"sec"},"拍摄基本功"));
RULES.forEach(function(r,ix){ main2.appendChild(el("div",{class:"rule"},"<b>"+(ix+1)+". "+esc(r[0])+"</b>："+esc(r[1]))); });
main2.appendChild(el("h2",{class:"sec"},"常犯错误 vs 正确做法"));
PAIRS.forEach(function(p){ main2.appendChild(el("div",{class:"pair"},'<div class="no">✗ '+esc(p[0])+'</div><div class="yes">✓ '+esc(p[1])+'</div>')); });
main2.appendChild(el("h2",{class:"sec"},"交片"));
main2.appendChild(el("div",{class:"rule"},"每间店开一个文件夹，名字写「店名_日期」。用 Google Drive 或 AirDrop 传原档，不要自己剪、不要加滤镜。<br>拍完在「清单」按 <b>保存 / 发给老板</b>，把文件传给老板。"));

// ---- actions ----
var actions = el("div",{class:"actions"});
var bSave = el("button",{class:"btn primary",type:"button"},"保存 / 发给老板");
var bCopy = el("button",{class:"btn ghost",type:"button"},"复制文字");
var bNew = el("button",{class:"btn ghost",type:"button"},"新店");
actions.appendChild(bSave); actions.appendChild(bCopy); actions.appendChild(bNew);
document.body.appendChild(actions);
var toastEl = el("div",{class:"toast"}); document.body.appendChild(toastEl);
function toast(m){ toastEl.textContent=m; toastEl.className="toast show"; clearTimeout(toast._t); toast._t=setTimeout(function(){toastEl.className="toast";},2600); }
var modal = el("div",{class:"modal"},'<div class="box"><b>开始新店？</b><p style="margin:8px 0 0;color:#8a8073;font-size:15px">现在这间店会自动存进「记录」，然后清空，开始新店。</p><div class="row"><button class="btn ghost" type="button" data-x="no">取消</button><button class="btn primary" type="button" data-x="yes">清空，开始新店</button></div></div>');
document.body.appendChild(modal);
modal.onclick=function(e){ var x=e.target.getAttribute("data-x"); if(x==="yes"){ archive(); state=blank(); persist(); location.reload(); } if(x==="no"||e.target===modal) modal.className="modal"; };
bNew.onclick=function(){ modal.className="modal show"; };
if(SAVED){ bNew.style.display="none"; }

function summary(){
 var lines=["【Potato成长视频计划】","店名："+(state.shop||"（未填）"),"完成："+allItems().filter(isDone).length+" / "+allItems().length,""];
 GROUPS.forEach(function(g){ lines.push("■ "+g.name); g.items.forEach(function(i){ var v=i.input?(" ："+((state.info[i.id]||"").trim()||"（未填）")):""; lines.push((isDone(i)?"✅ ":"⬜ ")+i.t+v); }); lines.push(""); });
 if((state.notes||"").trim()) lines.push("备注："+state.notes.trim());
 return lines.join("\n");
}
function copyText(s, msg){
 try{ navigator.clipboard.writeText(s).then(function(){ toast(msg); }, function(){ fallbackCopy(s, msg); }); }catch(e){ fallbackCopy(s, msg); }
}
function fallbackCopy(s, msg){ var t=el("textarea"); t.value=s; document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); toast(msg||"已复制"); }catch(e){ toast("复制不到，请截图"); } t.remove(); }
bCopy.onclick=function(){ copyText(summary(), "已复制，去 WhatsApp 贴给老板"); };
function partText(g){
 var lines=["【Potato · "+(state.shop||"未命名店")+"】"+g.name+" ✅ 完成"];
 g.items.forEach(function(i){ lines.push("✅ "+i.t+(i.input?" ："+((state.info[i.id]||"").trim()):"")); });
 return lines.join("\n");
}
function sendPart(g){
 var s=partText(g), msg="「"+g.name+"」已保存，文字已复制，可以贴到 WhatsApp";
 if(navigator.share){ navigator.share({text:s}).then(function(){ toast("「"+g.name+"」已保存并发出"); }, function(){ copyText(s, msg); }); }
 else copyText(s, msg);
}

function snapshot(st){
 st = st || state;
 var css=document.getElementById("css").textContent, app=document.getElementById("app").textContent;
 var snap=JSON.parse(JSON.stringify(st)); if(st===state || !snap.savedAt) snap.savedAt=stamp();
 var data=JSON.stringify(snap).replace(/</g,"\\x3c");
 var S="scr"+"ipt";
 return "<!DOCTYPE html>\n<html lang=\"zh\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Potato成长视频计划 · "+esc(st.shop||"未命名店")+"</title><style id=\"css\">"+css+"</style></head><body><"+S+">window.__POTATO_SAVED__="+data+";</"+S+"><"+S+" id=\"app\">"+app+"</"+S+"></body></html>";
}
function fileName(st){ st = st || state; var n=(st.shop||"未命名店").replace(/[\\\/:*?"<>|\s]+/g,""); return "Potato成长视频计划_"+n+"_"+(st.mmdd||today())+".html"; }

var downloads=null;
bSave.style.display = SAVED ? "none" : "";
function nativeSave(name, html){
 var blob=new Blob([html],{type:"text/html"});
 try{
  var file=new File([blob],name,{type:"text/html"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
   return navigator.share({files:[file],title:name}).then(function(){ toast("已分享："+name); }, function(e){ if(e&&e.name==="AbortError") toast("取消了"); else linkSave(name,blob); });
  }
 }catch(e){}
 linkSave(name,blob);
}
function linkSave(name, blob){
 try{
  var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(url);},4000);
  toast("已下载："+name+"（已存进「记录」），去 WhatsApp 发给老板");
 }catch(e){ toast("保存不到，请按「复制文字」"); }
}
bSave.onclick=function(){
 if(!(state.shop||"").trim()){ toast("先填店名"); shopIn.focus(); return; }
 archive();
 var name=fileName(), html=snapshot();
 if(downloads){
  downloads.save({filename:name, data:html}).then(function(){ toast("已保存："+name); }, function(e){ var c=e&&e.code; if(c==="declined") toast("取消了"); else if(c==="rate_limited") toast("稍等一下再按"); else nativeSave(name, html); });
 } else { nativeSave(name, html); }
};
function renderHist(){
 main3.innerHTML="";
 var h=loadHist(), tot=allItems().length;
 if(!h.length){ main3.appendChild(el("div",{class:"empty"},"还没有记录。<br>拍完一间店按「保存 / 发给老板」或「新店」，就会存在这里。")); return; }
 main3.appendChild(el("div",{class:"rule"},"共 "+h.length+" 间店。记录只存在这部手机，换手机前记得每间都发给老板。"));
 h.forEach(function(st){
  var done=allItems().filter(function(i){ return isDoneIn(st,i); }).length;
  var c=el("div",{class:"hist"},"<h3>"+esc(st.shop||"未命名店")+"</h3><div class=\"meta\">"+esc(st.savedAt||"")+" · 完成 "+done+" / "+tot+"</div>");
  var row=el("div",{class:"row"});
  var bv=el("button",{class:"btn ghost",type:"button"},"查看"), br=el("button",{class:"btn primary",type:"button"},"再发一次"), bd=el("button",{class:"btn danger",type:"button"},"删除");
  bv.onclick=function(){ location.hash="view="+encodeURIComponent(st.id); };
  br.onclick=function(){ nativeSave(fileName(st), snapshot(st)); };
  bd.onclick=function(){
   if(bd.getAttribute("data-sure")){ saveHist(loadHist().filter(function(x){ return x.id!==st.id; })); renderHist(); toast("已删除"); return; }
   bd.setAttribute("data-sure","1"); bd.textContent="确定删除？"; setTimeout(function(){ bd.removeAttribute("data-sure"); bd.textContent="删除"; },3000);
  };
  row.appendChild(bv); row.appendChild(br); row.appendChild(bd); c.appendChild(row); main3.appendChild(c);
 });
}
if(!SAVED && location.hash==="#hist") showTab(3);
if(!SAVED && window.claude && window.claude.use){ window.claude.use("downloads").then(function(d){ downloads=d; }).catch(function(){}); }
})();
</script>
